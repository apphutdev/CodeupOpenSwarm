name: Orca Windows Contract

on:
  pull_request:
    paths:
      - "factory/**"
      - ".github/workflows/orca-windows-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orca-contract:
    name: Orca MCP contract (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ORCA_COMMIT: 5beeefcb57555962bb93facc54b5f82484731802

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install pinned Orca
        shell: pwsh
        run: |
          go install "github.com/orca-cli/orca/cmd/orca@$env:ORCA_COMMIT"
          $goBin = Join-Path (go env GOPATH) "bin"
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify executable Orca contract
        shell: pwsh
        run: ./factory/tests/orca-contract.ps1
